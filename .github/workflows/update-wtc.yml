name: Refresh WTC standings

# The WTC table only moves when a WTC Test finishes — a few times a month — so this
# runs daily rather than on the 10-minute data cron. It is deliberately a SEPARATE
# workflow: it installs a headless browser (~90s), and a failure here must never
# affect the main data pipeline.
on:
  schedule:
    - cron: "20 3 * * *"     # daily, 03:20 UTC (after most Test days have ended)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wtc
  cancel-in-progress: false

jobs:
  wtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (SHA-pinned)

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6 (SHA-pinned)
        with:
          python-version: "3.12"

      - name: Install Playwright (chromium only)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Refresh WTC standings
        run: python build_wtc.py

      - name: Commit if changed
        run: |
          git config user.name  "cricket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wtc.json
          git diff --staged --quiet || git commit -m "Update WTC standings $(date -u +%FT%TZ)"
          git diff --quiet HEAD origin/main -- wtc.json 2>/dev/null || {
            git pull --rebase origin main
            git push
          }
